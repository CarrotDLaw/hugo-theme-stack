{{ if (.Context.Scratch.Get "TOCEnabled") }}
    <section class="widget archives">
        <div class="widget-header">
            <div class="widget-icon">
                {{ partial "helper/icon" "list-tree" }}
            </div>
            <h2 class="widget-title section-title" style="margin:0;">{{ T "article.tableOfContents" }}</h2>
        </div>
        <div class="widget--toc">
            <nav class="toc-nav" id="TableOfContents">
                {{ partial "article/components/toc" .Context | safeHTML }}
            </nav>
        </div>
    </section>
{{ end }}
